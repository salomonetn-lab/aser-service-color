<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Nuancier de peinture automobile</title>
  <desc id="description">Illustration d'un nuancier de couleurs pour peinture automobile à côté d'une carrosserie brillante.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e328e"/>
